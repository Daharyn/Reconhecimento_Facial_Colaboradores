<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconhecimento Facial - Motiva</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    :root {
      --roxo: #5E22F3;
      --cinza-fundo: #f4f5ff;
      --borda: #D6D7E9;
      --texto: #080314;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--cinza-fundo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: var(--roxo);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(94,34,243,0.25);
    }
    header img { height: 36px; width: auto; }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(94,34,243,0.10);
      padding: 36px 32px 40px;
      margin: 36px 16px;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-title { font-size: 1.25em; font-weight: 700; color: var(--roxo); margin-bottom: 4px; text-align: center; }
    .card-sub   { font-size: 0.88em; color: #777; margin-bottom: 24px; text-align: center; }
    .camera-wrapper { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 16px; }
    #webcam-container { width: 220px; height: 220px; border: 3px solid var(--borda); border-radius: 14px; overflow: hidden; background: #000; }
    .indicator-box { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 110px; }
    .indicator {
      width: 28px; height: 28px; border-radius: 50%;
      background-color: #ffffff; border: 2px solid #bbb;
      transition: background-color 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .indicator.white  { background-color: #ffffff; border-color: #bbb;     box-shadow: 0 0 8px rgba(180,180,180,0.7); }
    .indicator.yellow { background-color: #ffc107; border-color: #ffc107;  box-shadow: 0 0 12px #ffc107; }
    .indicator.green  { background-color: #28a745; border-color: #28a745;  box-shadow: 0 0 12px #28a745; }
    .indicator.red    { background-color: #dc3545; border-color: #dc3545;  box-shadow: 0 0 12px #dc3545; }
    #led-label { font-size: 0.78em; font-weight: 600; color: #555; text-align: center; line-height: 1.3; }
    .progress-bar-wrap { width: 100%; max-width: 220px; background: var(--borda); border-radius: 8px; height: 8px; margin-bottom: 16px; overflow: hidden; }
    #progress-bar { height: 8px; width: 0%; background: var(--roxo); border-radius: 8px; transition: width 0.1s linear; }
    #status { font-size: 1em; font-weight: 600; color: #333; min-height: 52px; text-align: center; margin-bottom: 18px; line-height: 1.5; }
    .btn-group { display: flex; gap: 12px; justify-content: center; }
    .btn { padding: 11px 24px; font-size: 0.95em; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; transition: opacity 0.2s, transform 0.1s; }
    .btn:hover  { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-confirm { background: var(--roxo); color: #fff; }
    .btn-repeat  { background: #e8e8f0; color: #444; }
    .btn-group         { display: none; }
    .btn-group.visible { display: flex; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-title">Acesso a Documentos</div>
    <div class="card-sub">Aproxime o rosto da câmera para validar seu acesso.</div>

    <div class="camera-wrapper">
      <div id="webcam-container"></div>
      <div class="indicator-box">
        <div id="led-indicator" class="indicator white"></div>
        <div id="led-label">Aguardando face</div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>

    <div id="status">Inicializando câmera...</div>

    <div class="btn-group" id="btn-group">
      <button class="btn btn-confirm" onclick="confirmarAcesso()">Confirmar acesso</button>
      <button class="btn btn-repeat"  onclick="repetirLeitura()">Repetir</button>
    </div>
  </div>

  <script>

    const URL_MODELO = "https://daharyn.github.io/Reconhecimento_Facial/";

    const linksOneDrive = {
      "Diego_Felipe": "https://grupoccr.sharepoint.com/:f:/s/InterfaceTramoIII2/IgDUoEZtZyKtRIZDu2vtehGyAbBS1jjc7QCZQ_QsBltCQ8g?e=MFZFaN",
      "Jorge_Alan":   "https://grupoccr.sharepoint.com/:f:/s/InterfaceTramoIII2/IgClHMOoNrXlT5U8UVqut-eQAfzGB8J21O_Pp2APIl_qCJs?e=sSeA4h"
    };

    function formatarNome(chave) { return chave.replace(/_/g, " "); }

    const CONFIRMACAO_MINIMA   = 0.90;
    const TEMPO_CONFIRMACAO_MS = 2000;

    let model, webcam, emPausa = false;
    let colaboradorPendente = null;
    let tempoInicioLeitura  = null;

    async function init() {
      model  = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
      webcam = new tmImage.Webcam(220, 220, true);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      atualizarSinalizador("white", "Aguardando face");
      document.getElementById("status").innerText = "Aguardando reconhecimento...";
    }

    async function loop() {
      webcam.update();
      if (!emPausa) await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      const melhor = prediction.reduce((a, b) => a.probability > b.probability ? a : b);

      // Rosto cadastrado detectado com confianca suficiente
      if (melhor.className !== "background" && melhor.probability >= CONFIRMACAO_MINIMA) {
        if (colaboradorPendente !== melhor.className) {
          colaboradorPendente = melhor.className;
          tempoInicioLeitura  = Date.now();
        }
        const decorrido   = Date.now() - tempoInicioLeitura;
        const porcentagem = Math.min((decorrido / TEMPO_CONFIRMACAO_MS) * 100, 100);
        document.getElementById("progress-bar").style.width = porcentagem + "%";
        document.getElementById("status").innerText = "Identificando colaborador...";
        atualizarSinalizador("yellow", "Realizando leitura");

        if (decorrido >= TEMPO_CONFIRMACAO_MS) {
          emPausa = true;
          document.getElementById("progress-bar").style.width = "100%";
          const nomeFormatado = formatarNome(colaboradorPendente);
          document.getElementById("status").innerHTML =
            "Colaborador identificado:<br><strong>" + nomeFormatado + "</strong>";
          atualizarSinalizador("green", "Identificado");
          document.getElementById("btn-group").classList.add("visible");
        }

      // Rosto presente mas nao reconhecido
      } else if (melhor.className !== "background" && melhor.probability < CONFIRMACAO_MINIMA) {
        colaboradorPendente = null;
        tempoInicioLeitura  = null;
        document.getElementById("progress-bar").style.width = "0%";
        document.getElementById("status").innerText = "Colaborador nao identificado.";
        atualizarSinalizador("red", "Nao identificado");

      // Nenhum rosto na camera
      } else {
        colaboradorPendente = null;
        tempoInicioLeitura  = null;
        document.getElementById("progress-bar").style.width = "0%";
        document.getElementById("status").innerText = "Aguardando reconhecimento...";
        atualizarSinalizador("white", "Aguardando face");
      }
    }

    function confirmarAcesso() {
      if (colaboradorPendente && linksOneDrive[colaboradorPendente]) {
        document.getElementById("status").innerText = "Acesso validado! Abrindo diretorio...";
        atualizarSinalizador("green", "Acesso liberado");
        setTimeout(() => window.open(linksOneDrive[colaboradorPendente], "_blank"), 800);
      } else {
        document.getElementById("status").innerText = "Colaborador nao encontrado no sistema.";
        atualizarSinalizador("red", "Nao autorizado");
      }
    }

    function repetirLeitura() {
      emPausa             = false;
      colaboradorPendente = null;
      tempoInicioLeitura  = null;
      document.getElementById("progress-bar").style.width = "0%";
      document.getElementById("btn-group").classList.remove("visible");
      document.getElementById("status").innerText = "Aguardando reconhecimento...";
      atualizarSinalizador("white", "Aguardando face");
    }

    function atualizarSinalizador(cor, texto) {
      document.getElementById("led-indicator").className = "indicator " + cor;
      document.getElementById("led-label").innerText = texto;
    }

    init();
  </script>
</body>
</html>
